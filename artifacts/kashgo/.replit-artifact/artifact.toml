kind = "web"
previewPath = "/"
title = "kashGo Customer App"
description = "A mobile-first customer wallet experience for balances, transfers, bill payments, gift cards, vouchers, donations, and account management."
version = "1.0.0"
id = "artifacts/kashgo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25617

[services.development]
run = "pnpm --filter @workspace/kashgo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kashgo", "run", "build" ]
serve = "static"
publicDir = "artifacts/kashgo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25617"
BASE_PATH = "/"
